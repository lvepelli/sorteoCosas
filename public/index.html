<!doctype html>
<html lang="es"><head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SORTEO</title>
  <link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/modern.css"><link rel="stylesheet" href="/direct.css"><link rel="stylesheet" href="/ticket-fix.css">
  <script src="/app.js" defer></script>
</head><body>
  <header><a class="brand" href="/">SORTEO</a><a class="admin-link" href="/admin.html">Administración</a></header>
  <main>
    <section class="hero hero-minimal"><div class="entry"><h1>SORTEO</h1><form id="register" class="registration-card"><label>Nombre<input name="first" autocomplete="given-name" required minlength="2" maxlength="80" placeholder="Nombre"></label><label>Apellido<input name="last" autocomplete="family-name" required minlength="2" maxlength="80" placeholder="Apellido"></label><button>Participar</button></form></div><figure class="hero-art"><img src="/bombo-dorado-sorteo.png" alt="Bombo dorado de sorteo"></figure></section>
    <section class="stats compact-stats"><div><strong id="item-count">—</strong><span>premios</span></div><div><strong id="people-count">—</strong><span>personas inscritas</span></div><div class="actions"><a class="download" href="#directo" id="live-link">Ver sorteo en directo</a><a class="download" href="/api/results.csv">Descargar resultados</a></div></section>
    <section id="directo" class="live" hidden><div id="stage" aria-live="polite"></div><div id="results" class="results"></div></section>
  </main>
</body></html>
